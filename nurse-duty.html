@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root {
  /* 파스텔 팔레트 — 밝고 따뜻한 병동 느낌 */
  --bg: #fef6f9;
  --surface: #ffffff;
  --surface2: #fdf0f5;
  --border: #f0d6e4;
  --border2: #e8c8d8;

  /* 포인트 컬러 */
  --pink:  #f472b6;
  --pink2: #ec4899;
  --peach: #fb923c;
  --mint:  #34d399;
  --sky:   #60a5fa;
  --lav:   #a78bfa;
  --rose:  #fb7185;

  /* 듀티 컬러 */
  --D:  #f59e0b;  /* 데이   — 따뜻한 앰버 */
  --E:  #10b981;  /* 이브닝 — 민트 그린 */
  --N:  #6366f1;  /* 나이트 — 인디고 */
  --OFF:#94a3b8;  /* 휴무   — 슬레이트 */
  --AL: #f43f5e;  /* 연차   — 로즈 */
  --KB: #f97316;  /* 기복   — 오렌지 */
  --SL: #8b5cf6;  /* 병가   — 바이올렛 */
  --TL: #ec4899;  /* 팀장   — 핑크 */

  --text:  #1e1b2e;
  --sub:   #9ca3af;
  --sub2:  #6b7280;

  --r: 16px;
  --r2: 12px;
  --sat: env(safe-area-inset-top,0px);
  --sab: env(safe-area-inset-bottom,0px);
  --shadow: 0 2px 16px rgba(244,114,182,.12);
  --shadow2: 0 1px 4px rgba(0,0,0,.06);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
.hdr {
  background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);
  border-bottom: 1.5px solid var(--border);
  padding: calc(var(--sat)+14px) 18px 14px;
  position: sticky; top:0; z-index:100;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.hdr-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px }
.hdr-logo { display:flex; align-items:center; gap:8px }
.hdr-logo .icon { font-size:24px; line-height:1 }
.hdr-logo h1 { font-size:17px; font-weight:900; color:var(--pink2); letter-spacing:-.5px }
.hdr-logo span { font-size:11px; color:var(--sub2); font-weight:500 }
.mnav { display:flex; align-items:center; gap:8px }
.mnav button {
  background: white; border: 1.5px solid var(--border2);
  color: var(--pink2); width:34px; height:34px; border-radius:50%;
  font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow2);
}
.mlbl {
  font-size:16px; font-weight:900; min-width:92px; text-align:center;
  color: var(--text); letter-spacing:-.3px;
}

/* ── TABS ── */
.tabs {
  display:flex; background:#fff;
  border-bottom: 1.5px solid var(--border);
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none }
.tab {
  padding:12px 14px; font-size:12px; font-weight:700; color:var(--sub);
  cursor:pointer; white-space:nowrap; border-bottom:2.5px solid transparent;
  transition:all .2s; flex-shrink:0; letter-spacing:-.2px;
}
.tab.active { color:var(--pink2); border-bottom-color:var(--pink2) }

/* ── CONTENT ── */
.content { padding:14px 14px calc(var(--sab)+90px) }

/* ── BADGE ── */
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:28px; border-radius:8px;
  font-size:10px; font-weight:900; flex-shrink:0;
}
.bd { background:#fef3c7; color:#d97706; border:1px solid #fde68a }
.be { background:#d1fae5; color:#059669; border:1px solid #a7f3d0 }
.bn { background:#ede9fe; color:#4f46e5; border:1px solid #c4b5fd }
.bo { background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0 }
.ba { background:#ffe4e6; color:#e11d48; border:1px solid #fecdd3 }
.bk { background:#ffedd5; color:#ea580c; border:1px solid #fed7aa }
.bs { background:#f3e8ff; color:#7c3aed; border:1px solid #ddd6fe }
.bx { background:transparent; color:transparent; border:none }

/* ── TABLE ── */
.twrap {
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  border-radius:var(--r2); border:1.5px solid var(--border);
  box-shadow: var(--shadow2);
}
table { border-collapse:collapse; width:100%; font-size:10px }
thead th {
  background:#fdf2f8; color:var(--sub2); font-weight:700;
  padding:6px 2px; text-align:center; white-space:nowrap;
  border-bottom:1.5px solid var(--border);
}
thead th.nc {
  min-width:64px; position:sticky; left:0; z-index:10;
  background:#fdf2f8; border-right:1.5px solid var(--border);
}
thead th.hol { color:var(--AL)!important; font-weight:900 }
thead th.sun { color:#f87171 }
thead th.sat { color:#60a5fa }
tbody tr { border-bottom:1px solid #fce7f3 }
tbody tr:last-child { border-bottom:none }
tbody tr:hover { background:#fef9fb }
td { padding:3px 1px; text-align:center; vertical-align:middle }
td.nc {
  position:sticky; left:0; background:#fff; z-index:5;
  font-size:10px; font-weight:700; min-width:64px;
  padding:5px 7px; text-align:left;
  border-right:1.5px solid var(--border);
}
td.nc .jd { font-size:8px; color:var(--sub); margin-top:1px }
td.nc .tltag { font-size:8px; color:var(--TL); font-weight:900 }
td.dc { cursor:pointer; min-width:26px }
td.dc:active { opacity:.55 }
td.cs { background:#f0f9ff }
td.ch { background:#fff1f2 }
tr.tl-row td.nc { border-left:3px solid var(--TL) }
tr.stat td {
  background:#fdf2f8; font-size:9px; color:var(--sub2);
  padding:3px 1px; border-top:1px solid var(--border);
}
tr.stat td.nc { color:var(--sub2); font-weight:700; font-size:9px }

/* 팀장 특근 셀 — 주말/공휴일 D 특근 */
td.tl-ot {
  background: linear-gradient(135deg,rgba(249,115,22,.25),rgba(251,146,60,.18)) !important;
  position: relative;
}
td.tl-ot .badge { box-shadow: 0 0 0 2px var(--KB); }
td.tl-ot::after {
  content: '⚡';
  position: absolute;
  top: 0px; right: 1px;
  font-size: 7px;
  line-height: 1;
}
td.rm { min-width:46px }
td.rm input {
  background:transparent; border:none; color:var(--sub2);
  font-size:9px; width:100%; outline:none; text-align:center;
}
td.cnt { font-size:10px; font-weight:900; min-width:22px }

/* ── CARDS ── */
.card {
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--r); padding:14px;
  box-shadow: var(--shadow2); margin-bottom:10px;
}
.card-pink { background:linear-gradient(135deg,#fce7f3,#fdf4ff) }

/* ── BUTTONS ── */
.btn-row { display:flex; gap:8px; margin-bottom:12px }
.genbtn {
  flex:1; background:linear-gradient(135deg,var(--pink),var(--lav));
  color:#fff; border:none; padding:14px 12px; border-radius:var(--r2);
  font-size:14px; font-weight:900; cursor:pointer;
  box-shadow:0 4px 16px rgba(244,114,182,.35);
  letter-spacing:-.2px; display:flex; align-items:center; justify-content:center; gap:6px;
}
.emgbtn {
  flex:0 0 auto; background:linear-gradient(135deg,var(--peach),#ef4444);
  color:#fff; border:none; padding:14px 14px; border-radius:var(--r2);
  font-size:13px; font-weight:900; cursor:pointer;
  box-shadow:0 4px 16px rgba(249,115,22,.35);
  display:flex; align-items:center; justify-content:center; gap:4px;
}
.printbtn {
  background:#fff; border:1.5px solid var(--border2);
  color:var(--sub2); padding:8px 14px; border-radius:var(--r2);
  font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
}
.bsm {
  background:#fff; border:1.5px solid var(--border);
  color:var(--text); padding:6px 12px; border-radius:20px;
  font-size:11px; font-weight:700; cursor:pointer;
  box-shadow: var(--shadow2);
}
.bdanger { border-color:#fecdd3; color:var(--AL) }
.bpri {
  width:100%; background:linear-gradient(135deg,var(--pink),var(--lav));
  color:#fff; border:none; padding:14px; border-radius:var(--r2);
  font-size:16px; font-weight:900; cursor:pointer; margin-top:8px;
  box-shadow:0 4px 16px rgba(244,114,182,.3);
}
.bcan {
  width:100%; background:#f8fafc; border:1.5px solid var(--border);
  color:var(--sub2); padding:13px; border-radius:var(--r2);
  font-size:15px; font-weight:700; cursor:pointer; margin-top:8px;
}

/* ── VER TAG ── */
.ver-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px }
.ver-tag {
  font-size:11px; color:var(--sub2); background:#fff;
  border:1.5px solid var(--border); border-radius:20px; padding:4px 11px;
  font-weight:600;
}

/* ── EMG BANNER ── */
.emg-banner {
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  border:1.5px solid #fed7aa; border-radius:var(--r2);
  padding:11px 14px; margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.emg-banner .etxt { flex:1; font-size:12px; color:#92400e; font-weight:700; line-height:1.5 }
.emg-badge {
  background:linear-gradient(135deg,var(--peach),#ef4444);
  color:#fff; font-size:10px; padding:3px 10px;
  border-radius:20px; font-weight:900; white-space:nowrap; flex-shrink:0;
}

/* ── LEGEND ── */
.legend { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px }
.li { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--sub2); font-weight:600 }

/* ── STAFF CARDS ── */
.scard {
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--r); padding:14px;
  display:flex; align-items:center; gap:12px;
  box-shadow: var(--shadow2); margin-bottom:10px;
}
.savt {
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:900; color:#fff;
  box-shadow:0 2px 8px rgba(244,114,182,.35);
}
.savt.tl { background:linear-gradient(135deg,var(--TL),var(--lav)) }
.sinf { flex:1 }
.sname { font-size:15px; font-weight:900; color:var(--text) }
.smeta { font-size:11px; color:var(--sub); margin-top:2px }
.sacts { display:flex; gap:6px }

/* ── MODAL ── */
.moverlay {
  position:fixed; inset:0; background:rgba(30,27,46,.6);
  z-index:200; display:flex; align-items:flex-end;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.modal {
  background:#fff; border-radius:24px 24px 0 0;
  width:100%; padding:20px 20px calc(var(--sab)+28px);
  max-height:88vh; overflow-y:auto;
  box-shadow:0 -8px 40px rgba(244,114,182,.2);
}
.mhandle {
  width:40px; height:4px; background:var(--border2);
  border-radius:2px; margin:0 auto 18px; flex-shrink:0;
}
.modal h3 { font-size:18px; font-weight:900; margin-bottom:14px; color:var(--text) }
.fg { margin-bottom:13px }
.fg label { font-size:12px; color:var(--sub2); margin-bottom:6px; display:block; font-weight:700 }
.fg input, .fg select {
  width:100%; background:#fafafa; border:1.5px solid var(--border2);
  color:var(--text); padding:12px 14px; border-radius:var(--r2);
  font-size:15px; outline:none; -webkit-appearance:none;
  font-family:inherit;
}
.fg input:focus, .fg select:focus { border-color:var(--pink) }

/* ── DUTY PICKER ── */
.dpicker { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px }
.dopt {
  padding:12px 3px; border-radius:12px; border:1.5px solid var(--border);
  background:#fafafa; cursor:pointer; font-weight:900; font-size:13px;
  text-align:center; transition:all .15s; font-family:inherit;
}
.dopt.sel { border-color:currentColor; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08) }
.dopt.forbidden { opacity:.25; cursor:not-allowed }
.dopt-D{color:var(--D)} .dopt-E{color:var(--E)} .dopt-N{color:var(--N)}
.dopt-OFF{color:var(--OFF)} .dopt-AL{color:var(--AL)}
.dopt-KB{color:var(--KB)} .dopt-SL{color:var(--SL)} .dopt-x{color:var(--sub)}

/* ── REQUEST ── */
.rsec { margin-bottom:18px }
.rsec h4 { font-size:13px; font-weight:900; margin-bottom:8px; display:flex; align-items:center; gap:6px }
.rcnt {
  font-size:10px; background:var(--AL); color:#fff;
  border-radius:20px; padding:1px 8px; font-weight:700;
}
.rcnt-off { background:var(--OFF) }
.daygrid { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px }
.dbtn {
  width:33px; height:33px; border-radius:8px; border:1.5px solid var(--border);
  background:#fff; color:var(--text); font-size:11px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow2);
}
.dbtn.s-off { background:#f1f5f9; border-color:var(--OFF); color:var(--OFF) }
.dbtn.s-al  { background:#ffe4e6; border-color:var(--AL); color:var(--AL) }
.dbtn.s-kb  { background:#ffedd5; border-color:var(--KB); color:var(--KB) }
.dbtn.pond  { border-color:#fca5a5; color:#fca5a5 }
.dbtn:disabled { opacity:.3; cursor:not-allowed }

/* ── HOL TAG ── */
.hol-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px }
.hol-tag {
  background:#fff0f3; border:1.5px solid #fecdd3; color:var(--AL);
  border-radius:20px; padding:5px 12px;
  font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer;
}

/* ── STATS ── */
.scards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px }
.scard2 {
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--r); padding:14px; box-shadow:var(--shadow2);
}
.scard2 .val { font-size:26px; font-weight:900 }
.scard2 .lbl { font-size:11px; color:var(--sub); margin-top:2px; font-weight:600 }
.ok   { color:#059669; font-size:11px; margin-top:4px; font-weight:700 }
.warn { color:var(--AL); font-size:11px; margin-top:4px; font-weight:700 }

/* ── GUIDE ── */
.guide-section { margin-bottom:20px }
.guide-section h3 {
  font-size:15px; font-weight:900; color:var(--pink2);
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}
.step-list { display:flex; flex-direction:column; gap:8px }
.step {
  display:flex; gap:12px; align-items:flex-start;
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--r2); padding:12px; box-shadow:var(--shadow2);
}
.step-num {
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  color:#fff; font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.step-num.orange { background:linear-gradient(135deg,var(--peach),#ef4444) }
.step-body { flex:1 }
.step-body .stitle { font-size:13px; font-weight:900; color:var(--text); margin-bottom:3px }
.step-body .sdesc { font-size:11px; color:var(--sub2); line-height:1.6 }
.step-body .sdesc strong { color:var(--text); font-weight:700 }
.highlight-box {
  background:linear-gradient(135deg,#fce7f3,#ede9fe);
  border:1.5px solid var(--border2); border-radius:var(--r2);
  padding:12px 14px; margin-bottom:10px;
  font-size:12px; color:var(--text); line-height:1.7;
}
.highlight-box strong { color:var(--pink2); font-weight:900 }
.install-step {
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--r2); padding:13px 14px;
  margin-bottom:8px; box-shadow:var(--shadow2);
}
.install-step .inum {
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%;
  background:var(--sky); color:#fff; font-size:11px; font-weight:900;
  margin-right:8px; flex-shrink:0;
}
.install-step p { font-size:12px; color:var(--sub2); line-height:1.6; display:flex; align-items:flex-start; gap:0 }
.install-step .ititle { font-size:13px; font-weight:900; color:var(--text); margin-bottom:4px; display:flex; align-items:center }
.icode {
  background:#f1f5f9; border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; font-size:11px;

<script>
// ══════════════════ 상수 ══════════════════
const DOW = ['일','월','화','수','목','금','토'];
const DUTY_LBL = {D:'데이',E:'이브닝',N:'나이트',OFF:'휴무',AL:'연차',KB:'기복휴가',SL:'병가','':'미정'};
const DUTY_DISP = {D:'D',E:'E',N:'N',OFF:'/',AL:'연',KB:'기',SL:'병',ROFF:'//',''  :'·'};

const DEFAULT_HOLIDAYS = [
  '2026-01-01','2026-01-28','2026-01-29','2026-01-30',
  '2026-03-01','2026-05-05','2026-06-06','2026-07-17',
  '2026-08-17','2026-10-03','2026-10-09','2026-12-25',
  '2025-01-01','2025-01-28','2025-01-29','2025-01-30',
  '2025-03-01','2025-05-05','2025-05-06','2025-06-06',
  '2025-08-15','2025-10-03','2025-10-05','2025-10-06','2025-10-07','2025-10-09','2025-12-25',
];

// ══════════════════ 스토어 ══════════════════
const DEFAULT_STAFF = [
  {id:1,name:'김창희',joinDate:'2024-08',isTL:true,remark:''},
  {id:2,name:'김은정',joinDate:'2024-11',isTL:false,remark:''},
  {id:3,name:'서은회',joinDate:'2026-02',isTL:false,remark:''},
  {id:4,name:'정경미',joinDate:'2026-07',isTL:false,remark:''},
  {id:5,name:'송은진',joinDate:'2024-10',isTL:false,remark:''},
];

function loadState(){
  // v5 먼저 시도
  try{
    const s=localStorage.getItem('nurseduty_v5');
    if(s) return JSON.parse(s);
  }catch(e){}

  // v5 없으면 이전 버전 순서대로 마이그레이션
  const prevKeys=['nurseduty_v4','nurseduty_v3','nurseduty_v2','nurseduty_v1'];
  for(const key of prevKeys){
    try{
      const s=localStorage.getItem(key);
      if(s){
        const old=JSON.parse(s);
        // 새 필드 보완
        if(!old.memos) old.memos={};
        if(!old.satRotIdx) old.satRotIdx={};
        if(!old.annualLeave) old.annualLeave={};
        if(!old.versions) old.versions={};
        if(!old.holidays) old.holidays=[...DEFAULT_HOLIDAYS];
        // v5로 저장 (마이그레이션)
        localStorage.setItem('nurseduty_v5', JSON.stringify(old));
        console.log(`데이터 마이그레이션: ${key} → nurseduty_v5`);
        return old;
      }
    }catch(e){}
  }

  // 아무것도 없으면 초기값
  return {
    staff:DEFAULT_STAFF, schedules:{}, requests:{}, remarks:{},
    holidays:[...DEFAULT_HOLIDAYS], versions:{},
    memos:{}, satRotIdx:{}, annualLeave:{},
  };
}
function save(){ localStorage.setItem('nurseduty_v5', JSON.stringify(state)) }

let state = loadState();
if(!state.holidays) state.holidays = [...DEFAULT_HOLIDAYS];
if(!state.versions) state.versions = {};
if(!state.memos) state.memos = {};
if(!state.satRotIdx) state.satRotIdx = {};
if(!state.annualLeave) state.annualLeave = {};

// ══════════════════ 연차 시스템 ══════════════════

// 입사일 기준 1년 이상 여부 (오늘 날짜 기준)
function isOver1Year(joinDate){
  if(!joinDate) return false;
  const [jy,jm]=joinDate.split('-').map(Number);
  const join=new Date(jy,jm-1,1);
  const now=new Date();
  const diff=(now-join)/(1000*60*60*24*365.25);
  return diff>=1;
}

// 연차 정보 가져오기
// total: 총 연차 (1년 미만이어도 가불 가능하도록 설정값 유지)
function getAL(sid){
  const staff=state.staff.find(s=>s.id==sid);
  const over1y=staff?isOver1Year(staff.joinDate):false;
  if(!state.annualLeave[sid]){
    state.annualLeave[sid]={
      total: over1y ? 15 : 0,  // 1년 이상이면 15일, 미만이면 0
      startYM:'2026-07'
    };
  }
  return state.annualLeave[sid];
}

// 시작월부터 현재 표시월까지 사용한 연차 합산
function usedAL(sid){
  const al=getAL(sid);
  const [sy,sm]=al.startYM.split('-').map(Number);
  let used=0;
  let cy=sy,cm=sm;
  while(cy<Y||(cy===Y&&cm<=M)){
    const sc=getSc(cy,cm);
    const D=dim(cy,cm);
    for(let d=1;d<=D;d++){
      if(sc[sid]?.[d]==='AL') used++;
    }
    cm++; if(cm>12){cm=1;cy++;}
  }
  return used;
}

// 잔여 연차 (마이너스 허용 — 가불)
function remainAL(sid){
  return getAL(sid).total - usedAL(sid);
}

// 주말/공휴일 여부
function isWeekendDay(y,m,d){
  const dt=new Date(y,m-1,d), dstr=ds(y,m,d);
  return isWH(dt,dstr);
}

// 이번달 주말 지정휴무 횟수
function wkndOffCount(sid, y, m){
  const rq=getRq(y,m);
  return (rq[sid]?.offDays||[]).filter(d=>isWeekendDay(y,m,d)).length;
}

// 이번달 주말 연차 횟수
function wkndAlCount(sid, y, m){
  const rq=getRq(y,m);
  return (rq[sid]?.alDays||[]).filter(d=>isWeekendDay(y,m,d)).length;
}

let Y=new Date().getFullYear(), M=new Date().getMonth()+1;
let activeTab='duty', modalEl=null;

// ══════════════════ 헬퍼 ══════════════════
function mk(y,m){ return `${y}-${String(m).padStart(2,'0')}` }
function ds(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` }
function dim(y,m){ return new Date(y,m,0).getDate() }
function isHol(s){ return state.holidays.includes(s) }
function isSat(dt){ return dt.getDay()===6 }
function isSun(dt){ return dt.getDay()===0 }
function isWH(dt,s){ return isSat(dt)||isSun(dt)||isHol(s) }

function getSc(y,m){
  const k=mk(y,m); if(!state.schedules[k]) state.schedules[k]={};
  state.staff.forEach(s=>{ if(!state.schedules[k][s.id]) state.schedules[k][s.id]={} });
  return state.schedules[k];
}
function getRq(y,m){
  const k=mk(y,m); if(!state.requests[k]) state.requests[k]={};
  state.staff.forEach(s=>{ if(!state.requests[k][s.id]) state.requests[k][s.id]={offDays:[],alDays:[]} });
  return state.requests[k];
}
function getRm(y,m){
  const k=mk(y,m); if(!state.remarks[k]) state.remarks[k]={};
  return state.remarks[k];
}
function getVer(y,m){
  const k=mk(y,m);
  if(!state.versions[k]) state.versions[k]={ver:0,updatedAt:null,emergency:false};
  return state.versions[k];
}
function bumpVer(y,m){
  const v=getVer(y,m); v.ver++; v.updatedAt=new Date().toISOString(); save();
}
function fmtDt(iso){
  if(!iso) return '-';
  const d=new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ══════════════════ 금지패턴 ══════════════════
function getForbidReason(sc,sid,day,duty){
  const p1 = day>1 ? sc[sid]?.[day-1]??'' : '';
  const p2 = day>2 ? sc[sid]?.[day-2]??'' : '';
  if(duty==='D' && p1==='N') return '나오데 금지 (나이트 다음날 데이)';
  if(duty==='E' && p1==='N') return '나오이 금지 (나이트 다음날 이브닝)';
  if(duty==='D' && p1==='E') return '이데 금지 (이브닝 다음날 데이)';
  if(duty==='N' && p1==='N') return '나이트 연속 2개 금지';
  if(duty==='E' && p1==='E' && p2==='E') return '이브닝 연속 3개 금지';
  return null;
}

// 퐁당퐁당: 새 날 추가 시 기존 OFF와 하루 간격이 생기면 금지
function isPongdang(offDays, newDay){
  for(const d of offDays){
    if(Math.abs(d-newDay)===2) return true;
  }
  return false;
}

// 토요일 D 횟수
function satDCnt(sc,sid,y,m){
  const D=dim(y,m); let n=0;
  for(let d=1;d<=D;d++){ if(isSat(new Date(y,m-1,d)) && sc[sid]?.[d]==='D') n++; }
  return n;
}

// 월별 메모 (작성자/특이사항)
function getMemo(y,m){
  const k=mk(y,m);
  if(!state.memos[k]) state.memos[k]={writer:'',note:''};
  return state.memos[k];
}

// ══════════════════ 자동생성 (수기표 패턴 방식) ══════════════════
function generate(emergency=false){
  const y=Y, m=M, D=dim(y,m);
  const rq=getRq(y,m);
  const existSc=getSc(y,m);

  const sc={};
  state.staff.forEach(s=>{ sc[s.id]={} });

  const tl=state.staff.find(s=>s.isTL);
  const nurses=state.staff.filter(s=>!s.isTL); // 4명 (입사순)
  const nursesByJoin=[...nurses]; // 앱 나열 순서 = 경력순 (그대로 유지)

  // ── 수기표 분석 기반 4인 순환 패턴 ──
  // 수기표에서 추출한 실제 패턴:
  // 블록 단위: 근무2~4일 + 휴무2~3일 반복
  // N은 월 8개 목표, 블록 2~3일
  // D는 최대 4~5일 연속
  // E는 최대 3~4일 연속
  // OFF는 2~3일 연속 (퐁당 없음)

  // 32일 주기 패턴 (31일 커버 + 여유 1일)
  // 4명이 각각 8일씩 오프셋 → 균등 분산
  const PATTERNS = [
    // 패턴 A (0일 오프셋): N블록 시작
    ['E','E','OFF','N','N','OFF','OFF','OFF','D','N','N','N','OFF','D','D','OFF',
     'E','E','D','OFF','N','N','N','OFF','OFF','OFF','OFF','D','D','D','E','OFF'],
    // 패턴 B (8일 오프셋): E블록 시작
    ['OFF','OFF','E','E','E','N','N','OFF','E','E','OFF','OFF','N','N','N','OFF',
     'D','D','OFF','D','D','OFF','D','N','N','N','OFF','E','E','E','OFF','OFF'],
    // 패턴 C (16일 오프셋): D블록 시작
    ['D','D','D','E','E','OFF','N','N','N','OFF','OFF','D','E','OFF','OFF','N',
     'N','OFF','E','E','E','OFF','OFF','E','E','N','N','N','OFF','OFF','OFF','D'],
    // 패턴 D (24일 오프셋): 혼합 시작
    ['N','N','N','OFF','D','E','E','E','OFF','OFF','E','E','OFF','E','E','E','OFF',
     'N','N','N','OFF','OFF','E','E','OFF','D','E','OFF','OFF','N','N','OFF'],
  ];

  // 입사 순서대로 패턴 배정
  nursesByJoin.forEach((n, idx)=>{
    const pat = PATTERNS[idx % PATTERNS.length];
    for(let d=1;d<=D;d++){
      sc[n.id][d] = pat[(d-1) % pat.length] || 'OFF';
    }
  });

  // ── 연차/지정휴무 덮어쓰기 ──
  nurses.forEach(n=>{
    rq[n.id]?.alDays.forEach(d=>{ sc[n.id][d]='AL' });
    rq[n.id]?.offDays.slice(0,2).forEach(d=>{ sc[n.id][d]='OFF' });
  });

  // ── 수기 입력 복원 ──
  nurses.forEach(n=>{
    Object.entries(existSc[n.id]||{}).forEach(([d,v])=>{ if(v) sc[n.id][parseInt(d)]=v });
  });

  // ── 금지패턴 교정 ──
  nurses.forEach(n=>{
    for(let d=2;d<=D;d++){
      if(existSc[n.id]?.[d]||rq[n.id]?.offDays.includes(d)||rq[n.id]?.alDays.includes(d)) continue;
      const p=sc[n.id][d-1];
      if(p==='N'&&(sc[n.id][d]==='D'||sc[n.id][d]==='E')) sc[n.id][d]='OFF';
      if(p==='E'&&sc[n.id][d]==='D') sc[n.id][d]='E';
    }
  });

  // ── N 개수 조정: 경력 순서 기준 (앱 나열 순서 = 경력순) ──
  // 위에서 아래로: 고참→막내 = N 적게→많게
  // 회사 입장: 고참(연봉 높음) N 최소, 막내(연봉 낮음) N 최다
  const nTargets = emergency ? [3,3,3,3] : [6,7,8,8]; // 경력순(앱순서) 고참→막내
  nursesByJoin.forEach((n, rank)=>{
    const tgt = nTargets[rank];
    let nCnt = Object.values(sc[n.id]).filter(v=>v==='N').length;
    // N 초과 → 다른 N 있는 날 OFF로
    for(let d=D;d>=1&&nCnt>tgt;d--){
      if(sc[n.id][d]==='N'&&!existSc[n.id]?.[d]&&!rq[n.id]?.alDays.includes(d)){
        const otherN=nurses.some(o=>o.id!==n.id&&sc[o.id][d]==='N');
        if(otherN){ sc[n.id][d]='OFF'; nCnt--; }
      }
    }
    // N 부족 → OFF를 N으로
    for(let d=1;d<=D&&nCnt<tgt;d++){
      if(sc[n.id][d]==='OFF'&&!existSc[n.id]?.[d]&&!rq[n.id]?.offDays.includes(d)&&!rq[n.id]?.alDays.includes(d)){
        const p=d>1?sc[n.id][d-1]:'';
        if(p!=='N'&&p!=='E'){ // 나오데/이데 방지
          sc[n.id][d]='N'; nCnt++;
        }
      }
    }
  });

  // ── 커버리지 보완 ──
  const isProtected=(n,d)=>{
    if(existSc[n.id]?.[d]) return true;
    if(rq[n.id]?.offDays.includes(d)) return true;
    if(rq[n.id]?.alDays.includes(d)) return true;
    if(['KB','SL','AL'].includes(sc[n.id][d])) return true;
    return false;
  };

  for(let d=1;d<=D;d++){
    const fillable=nurses.filter(n=>sc[n.id][d]==='OFF'&&!isProtected(n,d));
    const p=(n,d)=>d>1?sc[n.id][d-1]:'';

    // N 공백 보완
    if(!nurses.some(n=>sc[n.id][d]==='N')&&!emergency){
      const pick=fillable.find(n=>p(n,d)!=='N'&&p(n,d)!=='E');
      if(pick) sc[pick.id][d]='N';
    }
    // E 공백 보완
    if(!nurses.some(n=>sc[n.id][d]==='E')){
      const pick=fillable.find(n=>sc[n.id][d]==='OFF'&&p(n,d)!=='N');
      if(pick) sc[pick.id][d]='E';
    }
    // D 공백 보완 → 팀장 특근
    if(!nurses.some(n=>sc[n.id][d]==='D')){
      const pick=fillable.find(n=>sc[n.id][d]==='OFF'&&p(n,d)!=='N'&&p(n,d)!=='E');
      if(pick){
        sc[pick.id][d]='D';
      } else if(tl&&!existSc[tl.id]?.[d]&&!rq[tl.id]?.alDays.includes(d)){
        sc[tl.id][d]='D'; // 팀장 특근
      }
    }
  }

  // ── 팀장 스케줄 배정 ──
  if(tl){
    for(let d=1;d<=D;d++){
      if(sc[tl.id][d]) continue; // 특근 이미 있으면 유지
      const dt=new Date(y,m-1,d), dstr=ds(y,m,d);
      sc[tl.id][d]=isWH(dt,dstr)?'OFF':'D';
    }
    rq[tl.id]?.alDays.forEach(d=>{ sc[tl.id][d]='AL' });
    Object.entries(existSc[tl.id]||{}).forEach(([d,v])=>{ if(v) sc[tl.id][parseInt(d)]=v });
  }

  // ── 최종 D 공백 → 팀장 무조건 특근 ──
  for(let d=1;d<=D;d++){
    const hasD=nurses.some(n=>sc[n.id][d]==='D')||sc[tl?.id]?.[d]==='D';
    if(!hasD&&tl){ sc[tl.id][d]='D'; }
  }

  state.schedules[mk(y,m)]=sc;
  const v=getVer(y,m); v.ver++; v.updatedAt=new Date().toISOString(); v.emergency=emergency;
  save();
}

function renderReq(){

    </div>
  </div>`;

  state.staff.forEach(s=>{
    const req=rq[s.id], offN=req.offDays.length;
    const alInfo=!s.isTL?getAL(s.id):{total:0,startYM:''};
    const alUsed=!s.isTL?usedAL(s.id):0;
    const alRemain=!s.isTL?Math.max(0,alInfo.total-alUsed):0;
    const nameDisp=s.isTL?`${s.name} 팀장`:s.name;

    h+=`<div class="card"><div class="rsec">
      <h4>${nameDisp}
        <span class="rcnt rcnt-off">OFF ${offN}/2</span>
        ${!s.isTL?`<span class="rcnt" style="background:var(--AL)">연차 ${alRemain}/${alInfo.total}</span>`:''}
      </h4>`;

    if(!s.isTL){
      const wkndOff=wkndOffCount(s.id,Y,M);
      h+=`<div class="section-lbl">🔘 지정 휴무 (최대 2일 · 퐁당 불가 · 주말 1회/월)<br>
        <span style="color:var(--KB);font-size:10px">주말 지정휴무 ${wkndOff}/1회 사용</span>
      </div><div class="daygrid">`;
      for(let d=1;d<=D;d++){
        const isOff=req.offDays.includes(d), isAl=req.alDays.includes(d);
        const wouldP=!isOff&&isPongdang(req.offDays,d);
        const isWknd=isWeekendDay(Y,M,d);
        const wkndFull=!isOff&&isWknd&&wkndOff>=1; // 주말 1회 초과
        const dis=(!isOff&&offN>=2)||isAl||wouldP||wkndFull;
        let title='';
        if(wouldP) title='퐁당퐁당 패턴 불가';
        else if(wkndFull) title='주말 지정휴무 1회/월 초과';
        h+=`<button class="dbtn${isOff?' s-off':''}${wouldP||wkndFull?' pond':''}"
          ${dis?'disabled':''} onclick="toggleOff(${s.id},${d})"
          title="${title}" style="${isWknd&&!isOff?'border-color:var(--sky)':''}">${d}</button>`;
      }
      h+=`</div>`;
    }

    const over1y=isOver1Year(s.joinDate);
    const wkndAl=!s.isTL?wkndAlCount(s.id,Y,M):0;
    h+=`<div class="section-lbl" style="margin-top:10px">
      🟥 연차/월차
      ${!s.isTL?`<span style="font-size:10px;color:${alRemain<0?'var(--AL)':'var(--AL)'};margin-left:6px;font-weight:700">
        ${alRemain<0?`⚠️가불 ${Math.abs(alRemain)}일`:`남은 연차 ${alRemain}일`} / 총 ${alInfo.total}일
      </span>`:''}
      ${!s.isTL&&!over1y?`<span style="font-size:10px;color:var(--KB);margin-left:4px">1년미만·가불처리</span>`:''}
      ${!s.isTL?`<br><span style="font-size:10px;color:var(--sky)">주말 연차 ${wkndAl}/1회</span>`:''}
    </div><div class="daygrid">`;
    for(let d=1;d<=D;d++){
      const isAl=req.alDays.includes(d), isOff=req.offDays.includes(d);
      const isWknd=isWeekendDay(Y,M,d);
      // 주말 연차: 1년 이상만 + 1회/월 한정
      const wkndAlFull=!isAl&&isWknd&&(!over1y&&wkndAl>=1||over1y&&wkndAl>=1);
      const dis=isOff||(isWknd&&wkndAlFull);
      let title='';
      if(!over1y&&isWknd&&!isAl) title='1년미만: 주말 연차 불가 (가불 처리)';

      h+=`<button class="dbtn${isAl?' s-al':''}"
        ${dis?'disabled':''}
        onclick="toggleAl(${s.id},${d})"
        title="${title}"
        style="${isWknd?'border-color:var(--sky)':''}">${d}</button>`;
    }
    h+=`</div>`;

    if(!s.isTL){
      const isMinus=alRemain<0;
      const isNewbie=!isOver1Year(s.joinDate);
      h+=`<div style="margin-top:10px;background:${isMinus?'#fff1f2':'#fdf0f5'};border-radius:10px;padding:9px 12px;border:${isMinus?'1.5px solid var(--AL)':'none'}">

          📊 연차 현황:
          <strong style="color:${isMinus?'var(--AL)':'var(--AL)'}">
            ${isMinus?`⚠️ 가불 ${Math.abs(alRemain)}일 (마이너스)`:`${alRemain}일 남음`}
          </strong>
          (사용 ${alUsed}일 / 총 ${alInfo.total}일)<br>
          ${isNewbie?`<span style="color:var(--KB);font-size:10px">⚡ 1년 미만 — 연차 사용 시 가불 처리, 퇴사 시 급여 정산</span>`:''}
          ${isMinus?`<span style="color:var(--AL);font-size:10px">💸 가불 ${Math.abs(alRemain)}일 — 퇴사 시 급여 정산 대상</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <span style="font-size:11px;color:var(--sub2);font-weight:700;white-space:nowrap">총 연차 수정</span>
          <input type="number" min="0" max="30" value="${alInfo.total}"
            style="width:60px;background:#fff;border:1.5px solid var(--border2);color:var(--text);
                   padding:5px 8px;border-radius:8px;font-size:13px;outline:none"
            onchange="setALTotal(${s.id},this.value)">
          <span style="font-size:10px;color:var(--sub)">일</span>
        </div>
      </div>`;
    }
    h+=`</div></div><div class="divider"></div>`;
  });
  return h;
}

    <div class="scard2"><div class="val" style="color:var(--OFF)">${tOFF}</div><div class="lbl">전체 휴무</div></div>
  </div>
  <div class="card card-pink" style="margin-bottom:12px;font-size:12px;color:var(--sub2)"><strong style="color:var(--text)">5인 체제 목표</strong>: 나이트 8개 / 휴무 10일</div>
  <div style="display:flex;flex-direction:column;gap:0">`;

  nurses.forEach(n=>{
    let cnt={D:0,E:0,N:0,OFF:0,AL:0,KB:0,SL:0}, viols=[];
    const satD=satDCnt(sc,n.id,Y,M);
    for(let d=1;d<=D;d++){
      const v=sc[n.id]?.[d]??'';
      if(cnt[v]!==undefined) cnt[v]++;
      if(d>1){
        const p1=sc[n.id]?.[d-1]??'', p2=d>2?sc[n.id]?.[d-2]??'':'';
        if(p1==='N'&&v==='D') viols.push(`${d}일 나오데⛔`);
        if(p1==='N'&&v==='E') viols.push(`${d}일 나오이⛔`);
        if(p1==='E'&&v==='D') viols.push(`${d}일 이데⛔`);
        if(p1==='N'&&v==='N') viols.push(`${d}일 N연속⛔`);
        if(p1==='E'&&v==='E'&&p2==='E') viols.push(`${d}일 E3연속⛔`);
      }
    }
    const offTot=cnt.OFF+cnt.AL+cnt.KB+cnt.SL;
    h+=`<div class="scard" style="flex-direction:column;align-items:flex-start;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;width:100%">
        <div class="savt">${n.name.slice(-1)}</div>
        <div class="sinf"><div class="sname">${n.name}</div><div class="smeta">${n.joinDate} · 토요일 D ${satD}회</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge bd" style="width:auto;padding:3px 8px">D ${cnt.D}</span>
        <span class="badge be" style="width:auto;padding:3px 8px">E ${cnt.E}</span>
        <span class="badge bn" style="width:auto;padding:3px 8px">N ${cnt.N}</span>
        <span class="badge bo" style="width:auto;padding:3px 8px">/ ${offTot}</span>
        ${cnt.AL?`<span class="badge ba" style="width:auto;padding:3px 8px">연 ${cnt.AL}</span>`:''}
        ${cnt.KB?`<span class="badge bk" style="width:auto;padding:3px 8px">기 ${cnt.KB}</span>`:''}
        ${cnt.SL?`<span class="badge bs" style="width:auto;padding:3px 8px">병 ${cnt.SL}</span>`:''}
        <span style="font-size:10px;color:var(--AL);font-weight:700">연차잔여 ${remainAL(n.id)}일</span>
      </div>
      <div>
        ${cnt.N===8?'<div class="ok">✅ 나이트 8/8 달성</div>':`<div class="warn">⚠️ 나이트 ${cnt.N}/8</div>`}
        ${offTot===10?'<div class="ok">✅ 휴무 10/10 달성</div>':`<div class="warn">⚠️ 휴무 ${offTot}/10</div>`}
        ${viols.length?`<div class="warn">${viols.join(' ')}</div>`:''}
      </div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

// ══════════════════ 이벤트 ══════════════════
function attachEvents(){
  document.querySelectorAll('.dc').forEach(cell=>{
    cell.addEventListener('click',()=>{
      showDutyPicker(parseInt(cell.dataset.sid), parseInt(cell.dataset.day));
    });
  });
  document.querySelectorAll('input[data-rid]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const rm=getRm(Y,M); rm[inp.dataset.rid]=inp.value; save();
    });
  });
}

function showDutyPicker(sid,day){
  const s=state.staff.find(x=>x.id===sid);
  const sc=getSc(Y,M);
  const cur=sc[sid]?.[day]??'';
  const p1=day>1?sc[sid]?.[day-1]??'':'';
  const p2=day>2?sc[sid]?.[day-2]??'':'';
  const dt=new Date(Y,M-1,day), dow=DOW[dt.getDay()];

  const opts=s.isTL?['D','OFF','AL','KB','SL']:['D','E','N','OFF','AL','KB','SL'];
  let warns=[];
  if(p1==='N') warns.push('⚠️ 전날 나이트 → D/E/N 금지');
  if(p1==='E') warns.push('⚠️ 전날 이브닝 → D 금지');
  if(p1==='E'&&p2==='E') warns.push('⚠️ 이브닝 연속 3개 금지');

  let h=`<div class="mhandle"></div>
    <h3>${s.name} · ${M}월 ${day}일(${dow})</h3>
    ${warns.map(w=>`<div class="warn" style="margin-bottom:6px">${w}</div>`).join('')}
    <div class="dpicker">`;

  opts.forEach(d=>{
    const reason=getForbidReason(sc,sid,day,d);
    const disp=DUTY_DISP[d]??d;
    h+=`<div class="dopt dopt-${d} ${cur===d?'sel':''} ${reason?'forbidden':''}"
      onclick="${reason?`showToast('${reason}')`:`setDuty(${sid},${day},'${d}')`}">
      ${disp}<br><small style="font-size:8px">${DUTY_LBL[d]}</small>
    </div>`;
  });
  h+=`<div class="dopt dopt-x ${cur===''?'sel':''}" onclick="setDuty(${sid},${day},'')">·<br><small style="font-size:8px">미정</small></div>
    </div>
    <div style="background:#fdf0f5;border-radius:10px;padding:10px;font-size:11px;color:var(--sub2);margin-bottom:12px;line-height:1.6">
      💡 <strong>기</strong>=기복휴가(경조사) · <strong>병</strong>=병가 · <strong>연</strong>=연차<br>각각 별개 카운트
    </div>
    <button class="bcan" onclick="closeModal()">닫기</button>`;
  showModal(h);
}

function setDuty(sid,day,duty){
  const sc=getSc(Y,M);
  sc[sid][day]=duty;
  bumpVer(Y,M);
  closeModal(); render();
  showToast(`${state.staff.find(s=>s.id===sid)?.name} ${day}일 → ${duty||'미정'}`);
}

function toggleOff(sid,day){
  const rq=getRq(Y,M), req=rq[sid];
  const idx=req.offDays.indexOf(day);
  if(idx>-1){ req.offDays.splice(idx,1); }
  else{
    if(req.offDays.length>=2){ showToast('지정 휴무는 최대 2일'); return; }
    if(isPongdang(req.offDays,day)){ showToast('퐁당퐁당 패턴은 불가합니다 🙅'); return; }
    req.offDays.push(day);
  }
  save(); render();
}
function toggleAl(sid,day){
  const rq=getRq(Y,M), req=rq[sid];
  const idx=req.alDays.indexOf(day);
  if(idx>-1) req.alDays.splice(idx,1); else req.alDays.push(day);
  save(); render();
}
function toggleHol(dstr){
  const idx=state.holidays.indexOf(dstr);
  if(idx>-1) state.holidays.splice(idx,1); else state.holidays.push(dstr);
  save(); render();
}
function removeHol(dstr){ state.holidays=state.holidays.filter(h=>h!==dstr); save(); render(); }

function doGen(emergency){
  const msg=emergency
    ? '⚡ 긴급모드로 생성합니다.\nN 최대 3개 · D 최소 1명 기준으로 배정됩니다.\n기존 듀티가 덮어쓰여집니다.'
    : '✨ 자동 듀티를 생성합니다.\n기존 듀티가 덮어쓰여집니다.';
  if(!confirm(msg)) return;
  generate(emergency); render();
  showToast(emergency ? '⚡ 긴급 듀티 생성 완료' : '✨ 듀티 생성 완료');
}

function setALTotal(sid, val){
  const al=getAL(sid);
  al.total=parseInt(val)||15;
  save(); render();
  showToast('연차 총개수 수정 완료');
}

// 데이터 백업 (JSON 다운로드)
function exportData(){
  const json=JSON.stringify(state, null, 2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`dutybackup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 백업 파일 저장 완료');
}

// 데이터 복원 (JSON 업로드)
function importData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.staff||!data.schedules) throw new Error('잘못된 파일');
        if(!confirm('현재 데이터를 백업 파일로 덮어쓰겠습니까?')) return;
        Object.assign(state, data);
        save(); render();
        showToast('✅ 데이터 복원 완료');
      }catch(err){
        showToast('❌ 복원 실패: 올바른 백업 파일이 아닙니다');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveMemo(){
  const memo=getMemo(Y,M);
  const w=document.getElementById('writerInput');
  const n=document.getElementById('noteInput');
  if(w) memo.writer=w.value;
  if(n) memo.note=n.value;
  save();
}

function doPrint(){
  const ver=getVer(Y,M);
  const memo=getMemo(Y,M);
  document.getElementById('printTitle').textContent=`${Y}년 ${M}월 병동 근무표`;
  let meta=`Ver.${ver.ver}  |  수정: ${fmtDt(ver.updatedAt)}${ver.emergency?' | ⚡긴급모드':''}`;
  if(memo.writer) meta+=`  |  작성자: ${memo.writer}`;
  if(memo.note) meta+=`\n특이사항: ${memo.note}`;
  document.getElementById('printMeta').textContent=meta;
  document.getElementById('printHeader').style.display='block';
  window.print();
  setTimeout(()=>{ document.getElementById('printHeader').style.display='none'; },1500);
}

function editStaff(id){
  const s=state.staff.find(x=>x.id===id);
  showModal(`<div class="mhandle"></div><h3>✏️ 직원 편집</h3>
    <div class="fg"><label>성명</label><input id="e_n" value="${s.name}"></div>
    <div class="fg"><label>입사년월 (YYYY-MM)</label><input id="e_j" value="${s.joinDate}" placeholder="2024-01"></div>
    <div class="fg"><label>구분</label><select id="e_t">
      <option value="0" ${!s.isTL?'selected':''}>일반 간호사</option>
      <option value="1" ${s.isTL?'selected':''}>팀장 👑</option>
    </select></div>
    <button class="bpri" onclick="saveStaff(${id})">저장</button>
    <button class="bcan" onclick="closeModal()">취소</button>`);
}
function saveStaff(id){
  const s=state.staff.find(x=>x.id===id);
  s.name=document.getElementById('e_n').value.trim()||s.name;
  s.joinDate=document.getElementById('e_j').value.trim()||s.joinDate;
  s.isTL=document.getElementById('e_t').value==='1';
  save(); closeModal(); render(); showToast('저장 완료 ✅');
}
function delStaff(id){
  const s=state.staff.find(x=>x.id===id);
  if(!confirm(`${s.name}을(를) 삭제하시겠습니까?`)) return;
  state.staff=state.staff.filter(x=>x.id!==id);
  save(); render(); showToast('삭제 완료');
}
function showAddStaff(){
  showModal(`<div class="mhandle"></div><h3>👤 직원 추가</h3>
    <div class="fg"><label>성명</label><input id="n_n" placeholder="홍길동"></div>
    <div class="fg"><label>입사년월 (YYYY-MM)</label><input id="n_j" placeholder="2024-01"></div>
    <div class="fg"><label>구분</label><select id="n_t">
      <option value="0">일반 간호사</option>
      <option value="1">팀장 👑</option>
    </select></div>
    <button class="bpri" onclick="addStaff()">추가</button>
    <button class="bcan" onclick="closeModal()">취소</button>`);
}
function addStaff(){
  const name=document.getElementById('n_n').value.trim();
  if(!name){ showToast('이름을 입력해주세요'); return; }
  state.staff.push({
    id:Date.now(), name,
    joinDate:document.getElementById('n_j').value.trim()||'미상',
    isTL:document.getElementById('n_t').value==='1', remark:''
  });
  save(); closeModal(); render(); showToast('추가 완료 ✅');
}

function showModal(html){
  closeModal();
  const ov=document.createElement('div');
  ov.className='moverlay';
  ov.innerHTML=`<div class="modal">${html}</div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal() });
  document.body.appendChild(ov); modalEl=ov;
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null } }

function showTab(tab,el){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fab').style.display=tab==='staff'?'flex':'none';
  render();
}
function fabClick(){ showAddStaff() }
function changeMonth(delta){
  M+=delta; if(M>12){M=1;Y++;} if(M<1){M=12;Y--;} render();
}

let tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
